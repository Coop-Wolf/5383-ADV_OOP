<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Farm Shop</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <main class="game">

        <!-- Header -->
        <header class="game-header">

            <h1>🛒 Farm Shop</h1>

            <p>
                Purchase new equipment to grow your farm.
            </p>

        </header>


        <!-- Shop -->
        <section class="section">


            <!-- Farmers -->
            <div class="shop-section">

                <h3>👨‍🌾 Farmers</h3>

                <div
                    id="farmer-shop"
                    class="shop-grid">
                </div>

            </div>


            <!-- Plows -->
            <div class="shop-section">

                <h3>🚜 Plows</h3>

                <div
                    id="plow-shop"
                    class="shop-grid">
                </div>

            </div>


            <!-- Tractors -->
            <div class="shop-section">

                <h3>🚜 Tractors</h3>

                <div
                    id="tractor-shop"
                    class="shop-grid">
                </div>

            </div>


            <!-- Harvesters -->
            <div class="shop-section">

                <h3>🌾 Harvesters</h3>

                <div
                    id="harvester-shop"
                    class="shop-grid">
                </div>

            </div>


            <!-- Crop Dusters -->
            <div class="shop-section">

                <h3>✈️ Crop Dusters</h3>

                <div
                    id="crop-duster-shop"
                    class="shop-grid">
                </div>

            </div>


            <!-- Drones -->
            <div class="shop-section">

                <h3>🚁 Drones</h3>

                <div
                    id="drone-shop"
                    class="shop-grid">
                </div>

            </div>

        </section>

    </main>


    <!-- Navigation -->
    <nav class="bottom-nav">

        <a href="/" class="nav-item">
            <span class="nav-icon">🌾</span>
            <span>Farm</span>
        </a>


        <a href="/shop" class="nav-item active">
            <span class="nav-icon">🛒</span>
            <span>Shop</span>
        </a>


        <a href="/achievements" class="nav-item">
            <span class="nav-icon">🏆</span>
            <span>Achievements</span>
        </a>

    </nav>


    <script src="/static/script.js"></script>

</body>

</html>
