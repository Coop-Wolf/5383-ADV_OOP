<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Farm</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <main class="game">

        <!-- Header -->
        <header class="game-header">

            <h1>🌾 My Farm</h1>

            <p>
                Build your farm and grow your agricultural empire.
            </p>

        </header>


        <!-- Money -->
        <section class="farm-stats">

            <div class="farm-stat">

                <span class="farm-stat-label">
                    Money
                </span>

                <span
                    id="money"
                    class="farm-stat-value">
                    $0
                </span>

            </div>


            <div class="farm-stat">

                <span class="farm-stat-label">
                    Income
                </span>

                <span
                    id="income"
                    class="farm-stat-value">
                    $0/sec
                </span>

            </div>

        </section>


        <!-- Visual Farm -->
        <section class="visual-farm">

            <div class="farm-sky">
                <div class="sun"></div>

                <div class="cloud cloud-1"></div>
                <div class="cloud cloud-2"></div>
            </div>

            <div class="farm-land">

                <!-- Trees -->
                <div class="farm-tree tree-1">🌳</div>
                <div class="farm-tree tree-2">🌳</div>
                <div class="farm-tree tree-3">🌲</div>
                <div class="farm-tree tree-4">🌲</div>

                <!-- Farmhouse -->
                <div class="farmhouse">
                    <div class="house-roof">▲</div>
                    <div class="house-body">🏠</div>
                </div>

                <!-- Barn -->
                <div class="barn">
                    <div class="barn-roof">▲</div>
                    <div class="barn-body">🏚️</div>
                </div>

                <!-- Crop Field -->
                <div class="crop-field">

                    <div class="crop-row">🌱 🌱 🌱 🌱 🌱 🌱</div>
                    <div class="crop-row">🌱 🌱 🌱 🌱 🌱 🌱</div>
                    <div class="crop-row">🌱 🌱 🌱 🌱 🌱 🌱</div>
                    <div class="crop-row">🌱 🌱 🌱 🌱 🌱 🌱</div>

                </div>

                <!-- Dirt Road -->
                <div class="farm-road"></div>

                <!-- Equipment -->
                <div
                    id="farm-equipment"
                    class="farm-equipment">
                </div>
            </div>
        </section>


        <!-- Equipment -->
        <section class="section">

            <div class="section-header">

                <div>

                    <h2>Your Equipment</h2>

                    <p>
                        Upgrade your equipment to increase production.
                    </p>

                </div>

            </div>


            <div id="farmers"></div>

            <div id="plows"></div>

            <div id="tractors"></div>

            <div id="harvesters"></div>

            <div id="crop-dusters"></div>

            <div id="drones"></div>

        </section>

    </main>


    <!-- Navigation -->
    <nav class="bottom-nav">

        <a
            href="/"
            class="nav-item active">

            <span class="nav-icon">
                🌾
            </span>

            <span>
                Farm
            </span>

        </a>


        <a
            href="/shop"
            class="nav-item">

            <span class="nav-icon">
                🛒
            </span>

            <span>
                Shop
            </span>

        </a>


        <a
            href="/achievements"
            class="nav-item">

            <span class="nav-icon">
                🏆
            </span>

            <span>
                Achievements
            </span>

        </a>

    </nav>


    <script src="/static/script.js"></script>

</body>

</html>
