<h2 class="sr-only">UML class diagram for my Casino Program.</h2>
<div id="cd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const themeMode = document.documentElement.dataset.mode;
const dark = themeMode ? themeMode === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"anthropic-sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"anthropic-sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const src = `classDiagram
  class Game {
    <<abstract>>
    +name
    +player_class
    +min_players
    +welcome_sections
    +play()
    +playing_players()
    +enough_players()
    +sync_players()
    +whos_playing(first_round)
    +settle(player, bet, outcome, detail, multiplier)
    +redraw(kwargs)
    +pause(seconds)
    +welcome()
    +play_round()*
    +show_table()*
    +determine_winner()*
  }

  class Player {
    +name
    +chips
    +bet
    +earnings
    +wager(amount)
    +win(bet, multiplier)
    +lose(bet)
    +push(bet)
    +hit(deck)
    +place_bet()
    +get_player_info()
  }

  class Dealer {
    +hand_class
    +hand
    +reset_hand()
    +hit(deck)
  }

  class Hand {
    +cards
    +add_card(card)
  }

  class Card {
    +suit
    +rank
    +get_value()
    +get_poker_value()
  }

  class Deck {
    +cards
    +shuffle()
    +deal_card()
  }

  class Util {
    <<utility>>
    +clear_screen()
    +ask_yes_no(prompt)
    +ask_int(prompt, min, max)
    +banner(title, width)
  }

  class Casino {
    +GAMES
    +players
    +current_game
    +start()
    +play_game(game_class, single_player)
    +get_single_player()
    +add_funds()
    +add_or_remove_player()
    +get_players()
    +get_player_info()
    +welcome()
  }

  class Blackjack {
    +dealer
    +play_round()
    +deal_initial_cards()
    +show_table()
    +take_player_turn(player)
    +take_dealer_turn()
    +determine_winner()
  }

  class BlackjackPlayer {
    +hands
    +hand
    +reset_hands()
    +set_active_hand(index)
    +hand_label(index)
    +decide_action()
    +can_double_down()
    +can_split()
    +double_down(deck)
    +split(deck)
    +is_bust()
    +is_blackjack()
    +get_hand_value()
  }

  class BlackjackDealer {
    +decide_action()
    +get_hand_value()
    +is_bust()
    +get_visible_hand(reveal)
  }

  class BlackjackHand {
    +bet
    +stood
    +from_split
    +get_value()
    +is_bust()
    +is_blackjack()
  }

  class War {
    +war_dealer
    +war_player
    +play_round()
    +determine_winner()
    +show_table()
  }

  class WarPlayer

  class WarDealer

  class VideoPoker {
    +PAYTABLE
    +video_player
    +play_round()
    +show_table()
    +determine_winner()
    +score_hand(hand)
  }

  class VideoPokerPlayer {
    +choose_holds()
    +draw_replacements(deck, held)
  }

  class VideoPokerHand {
    +find_straight(ranks)
    +find_flush(cards)
    +is_jacks_or_better()
    +evaluate()
  }

  Game <|-- Blackjack
  Game <|-- War
  Game <|-- VideoPoker

  Player <|-- BlackjackPlayer
  Player <|-- WarPlayer
  Player <|-- VideoPokerPlayer

  Dealer <|-- BlackjackDealer
  Dealer <|-- WarDealer

  Hand <|-- BlackjackHand
  Hand <|-- VideoPokerHand

  Game o-- Player : game_players
  Dealer o-- Hand : hand
  Deck o-- Card : cards

  BlackjackPlayer o-- BlackjackHand : hands
  WarPlayer o-- Hand : hand
  VideoPokerPlayer o-- VideoPokerHand : hand

  Blackjack *-- BlackjackDealer : dealer
  War *-- WarDealer : war_dealer

  Casino o-- Player : players
  Casino ..> Game : creates
`;
const { svg } = await mermaid.render('cd-svg', src);
document.getElementById('cd').innerHTML = svg;
document.querySelectorAll('#cd svg .node').forEach(node => {
  const p = node.querySelector('rect, path');
  if (p && p.tagName === 'rect') p.setAttribute('rx', '8');
});
</script>
